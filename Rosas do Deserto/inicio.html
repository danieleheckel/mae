<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Plantas</title>
  <link rel="stylesheet" href="inicio.css">
  <link rel="icon" type="image/png" href="/icone.png">

<body>
  <main class="container">
    <header class="cabecalho">
      <h1>Catálogo de Plantas</h1>
      <p>Cadastre e organize suas plantas de forma simples.</p>
    </header>

    <section class="form-section">
      <form id="form-planta" class="formulario">
        <div class="campo">
          <label for="nome">Nome da planta</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Ex.: Rosa do Deserto"
            maxlength="60"
            required
          >
        </div>

        <div class="campo">
          <label for="descricao">Descrição</label>
          <textarea
            id="descricao"
            name="descricao"
            placeholder="Ex.: Flor rosa, gosta de sol pleno..."
            rows="4"
            maxlength="300"
          ></textarea>
        </div>

        <div class="campo">
          <label for="imagem">Imagem</label>
          <input
            type="file"
            id="imagem"
            name="imagem"
            accept="image/*"
            required
          >
        </div>

        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section class="catalogo-section">
      <h2>Plantas cadastradas</h2>
      <div id="mensagem-vazia" class="mensagem-vazia">
        Nenhuma planta cadastrada ainda.
      </div>
      <div id="catalogo" class="catalogo"></div>
    </section>
  </main>

  <script src="inicio.js"></script>
</body>
</html>
